name: Watch Dart stable

on:
  schedule:
    - cron: '23 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: dart-stable-watch
  cancel-in-progress: false

jobs:
  watch:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/github-script@v7
        with:
          script: |
            const watch = require('./.github/scripts/watch-dart.cjs');
            await watch({github, context, core});
