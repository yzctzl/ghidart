// Build the Dart extension against the selected Ghidra installation.
// Official buildExtension.gradle owns compilation and packaging. Local tasks
// stage the official ARM64 decoder and compile the sample verifier
// for offline sample checks. Tests and application samples are never packaged.
// Build against an explicit Ghidra installation; no b4a checkout is required.
def ghidraInstallDir = project.findProperty('GHIDRA_INSTALL_DIR') ?: System.getenv('GHIDRA_INSTALL_DIR')
if (!ghidraInstallDir) {
    throw new GradleException('Set GHIDRA_INSTALL_DIR to your Ghidra installation.')
}
apply from: new File(ghidraInstallDir, 'support/buildExtension.gradle')

tasks.named('processResources') {
    exclude 'META-INF/plugin.xml', 'META-INF/pluginIcon.svg', 'images/README.txt'
}

// Reuse the installed ARM64 definitions and metadata. Only a small transparent
// arithmetic specialization below is maintained by ghidart.
def languageDir = file('data/languages')
def manualDir = file('data/manuals')
def officialAarch64Dir = new File(
    ghidraInstallDir, 'Ghidra/Processors/AARCH64/data/languages')
def officialAarch64ManualDir = new File(
    ghidraInstallDir, 'Ghidra/Processors/AARCH64/data/manuals')
def prepareAarch64Language = tasks.register('prepareAarch64Language') {
    group = 'build'
    description = 'Stage the official ARM64 register mappings and manual index.'

    def dwarf = new File(officialAarch64Dir, 'AARCH64.dwarf')
    def manualIndex = new File(officialAarch64ManualDir, 'AARCH64.idx')
    inputs.files(dwarf, manualIndex)
    outputs.files(
        new File(languageDir, 'AARCH64.dwarf'),
        new File(manualDir, 'AARCH64.idx'))

    doLast {
        [dwarf, manualIndex].each { input ->
            if (!input.isFile()) {
                throw new GradleException("Missing official AArch64 language file: ${input}")
            }
        }
        copy {
            from dwarf
            into languageDir
        }
        copy {
            from manualIndex
            into manualDir
        }
    }
}

// A short-lived ARM64 ABI kept the heap base in x23. Derive its model from
// the common specification so fixes never require maintaining a second copy.
def prepareDartCompilerSpecs = tasks.register('prepareDartCompilerSpecs') {
    def source = new File(languageDir, 'AARCH64dart.cspec')
    def target = new File(languageDir, 'AARCH64dart-r23.cspec')
    inputs.file(source)
    outputs.file(target)
    doLast {
        def spec = new groovy.xml.XmlParser(false, false).parse(source)
        spec.global[0].appendNode('register', [name: 'x23'])
        def managed = spec.default_proto.prototype[0]
        def clobber = managed.killedbycall.register.find { it.@name == 'x23' }
        if (clobber == null) throw new GradleException('Missing managed x23 clobber')
        managed.killedbycall[0].remove(clobber)
        managed.unaffected[0].appendNode('register', [name: 'x23'])
        target.setText(groovy.xml.XmlUtil.serialize(spec), 'UTF-8')
    }
}

// The official module macro keeps both builds and user-directory installations
// independent of checkout paths; no official source files are copied or patched.
def compileDartLanguage = tasks.register('compileDartLanguage', Exec) {
    group = 'build'
    description = 'Compile the Dart wrapper over the installed official ARM64 sources.'
    def wrapper = new File(languageDir, 'AARCH64dart.slaspec')
    def argumentsFile = file('data/sleighArgs.txt')
    inputs.files(wrapper, argumentsFile, new File(ghidraInstallDir, 'Ghidra/application.properties'))
    inputs.files(fileTree(officialAarch64Dir) { include '*.sinc' })
    outputs.file(new File(languageDir, 'AARCH64dart.sla'))
    outputs.file(layout.buildDirectory.file('tmp/sleighArgs.txt'))
    doFirst {
        // Ghidra's development launcher reads the same options under build/tmp.
        copy {
            from argumentsFile
            into layout.buildDirectory.dir('tmp')
        }
        def windows = System.getProperty('os.name').toLowerCase().startsWith('windows')
        def launcher = new File(ghidraInstallDir, windows ? 'support/sleigh.bat' : 'support/sleigh')
        def arguments = [launcher.absolutePath, '-i', argumentsFile.absolutePath,
            wrapper.absolutePath, new File(languageDir, 'AARCH64dart.sla').absolutePath]
        commandLine(windows ? ['cmd', '/c'] + arguments : arguments)
    }
}

def verifySources = tasks.register('verifySources') {
    group = 'verification'
    description = 'Fail the extension build if the Java source tree is missing.'
    doLast {
        if (sourceSets.main.allJava.isEmpty()) {
            throw new GradleException('No Java sources in src/main/java; check source recovery before building.')
        }
    }
}

// Optional local verifier: samples/tests are not part of the source distribution.
if (file('tests/VerifyB4a.java').isFile()) {
    def compileB4aIntegration = tasks.register('compileB4aIntegration', JavaCompile) {
        group = 'verification'
        description = 'Compile the offline b4a sample verifier.'
        dependsOn tasks.named('compileJava')
        source 'tests/VerifyB4a.java'
        classpath = sourceSets.main.compileClasspath + sourceSets.main.output
        destinationDirectory = layout.buildDirectory.dir('b4a-integration-classes')
        options.encoding = 'UTF-8'
    }

    tasks.register('verifySamples', JavaExec) {
        group = 'verification'
        description = 'Verify local b4a documents and original binaries without starting Ghidra.'
        dependsOn compileB4aIntegration
        classpath = sourceSets.main.runtimeClasspath + files(compileB4aIntegration.flatMap { it.destinationDirectory })
        mainClass = 'VerifyB4a'
        maxHeapSize = '512m'
        args file(project.findProperty('samplesDir') ?: 'samples').absolutePath
    }
}

tasks.named('buildExtension') {
    includeEmptyDirs = false
    dependsOn verifySources, prepareAarch64Language, prepareDartCompilerSpecs, compileDartLanguage
    exclude 'data/languages/AARCH64.sla', 'samples/**', 'tools/**', 'tests/**', 'local/**', '.git/**', '.gitignore', '.vscode/**',
        'gradle.properties', 'ghidart-OLD/**'
    // Exclude the local Ghidra distribution.
    exclude { it.relativePath.segments[0].matches('ghidra_[0-9].*') }
}

// Replace files atomically: an already-running JVM may still hold the old JAR.
// Overwriting that JAR in place breaks its lazy class loading.
tasks.register('installExtension') {
    group = 'build'
    description = 'Install the built extension without overwriting open JAR files in place.'
    dependsOn tasks.named('buildExtension')
    doLast {
        def archive = tasks.named('buildExtension').get().archiveFile.get().asFile
        def destination = new File(ghidraInstallDir, 'Ghidra/Extensions').toPath()
        def zip = new java.util.zip.ZipFile(archive)
        try {
            zip.entries().each { entry ->
                def target = destination.resolve(entry.name).normalize()
                if (!target.startsWith(destination)) {
                    throw new GradleException("Invalid extension archive path: ${entry.name}")
                }
                if (!entry.directory) {
                    java.nio.file.Files.createDirectories(target.parent)
                    def temporary = java.nio.file.Files.createTempFile(target.parent, '.ghidart-', '.tmp')
                    try {
                        zip.getInputStream(entry).withCloseable { input ->
                            java.nio.file.Files.copy(input, temporary, java.nio.file.StandardCopyOption.REPLACE_EXISTING)
                        }
                        java.nio.file.Files.move(temporary, target,
                            java.nio.file.StandardCopyOption.ATOMIC_MOVE,
                            java.nio.file.StandardCopyOption.REPLACE_EXISTING)
                    } finally {
                        java.nio.file.Files.deleteIfExists(temporary)
                    }
                }
            }
        } finally {
            zip.close()
        }
        logger.lifecycle('Installed ghidart. Restart an existing Ghidra session to load this version.')
    }
}
