name: Build and release

on:
  pull_request:
    paths:
      - 'src/**'
      - 'data/**'
      - '*.gradle'
      - 'gradle/**'
      - 'gradlew*'
      - 'extension.properties'
      - 'Module.manifest'
      - '.github/**'
  push:
    branches: [main]
    tags:
      - '[0-9]*'
      - 'v[0-9]*'
  workflow_dispatch:
    inputs:
      ghidra_tag:
        description: 'validated, latest, or an explicit official Ghidra release tag'
        default: validated
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.event.repository.private == false
    outputs:
      ghidra_tag: ${{ steps.ghidra.outputs.tag }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Resolve Ghidra release
        id: ghidra
        uses: actions/github-script@v7
        env:
          GHIDRA_TAG: ${{ inputs.ghidra_tag || 'validated' }}
        with:
          script: |
            const repo = {owner: 'NationalSecurityAgency', repo: 'ghidra'};
            const baseline = require('./.github/compatibility.json');
            const tag = process.env.GHIDRA_TAG === 'validated'
              ? baseline.ghidra_tag : process.env.GHIDRA_TAG;
            const {data: release} = tag === 'latest'
              ? await github.rest.repos.getLatestRelease(repo)
              : await github.rest.repos.getReleaseByTag({...repo, tag});
            const assets = release.assets.filter(a => /^ghidra_.*_PUBLIC_\d+\.zip$/.test(a.name));
            if (assets.length !== 1) throw new Error('Expected one official Ghidra PUBLIC ZIP');
            const asset = assets[0];
            core.setOutput('tag', release.tag_name);
            core.setOutput('url', asset.browser_download_url);
            core.setOutput('api_url', asset.url);
            core.setOutput('digest', asset.digest || '');
            core.notice(`Building against ${release.tag_name}: ${asset.name}`);
      - name: Download Ghidra
        env:
          GHIDRA_URL: ${{ steps.ghidra.outputs.url }}
          GHIDRA_DIGEST: ${{ steps.ghidra.outputs.digest }}
          GHIDRA_API_URL: ${{ steps.ghidra.outputs.api_url }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! curl --fail --location --retry 3 --connect-timeout 30 --max-time 600 \
            "$GHIDRA_URL" -o "$RUNNER_TEMP/ghidra.zip"; then
            echo "Direct asset download failed; retrying through the official GitHub asset API."
            curl --fail --location --retry 3 --connect-timeout 30 --max-time 600 \
              -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/octet-stream" \
              "$GHIDRA_API_URL" -o "$RUNNER_TEMP/ghidra.zip"
          fi
          if [[ "$GHIDRA_DIGEST" == sha256:* ]]; then
            echo "${GHIDRA_DIGEST#sha256:}  $RUNNER_TEMP/ghidra.zip" | sha256sum --check
          fi
          mkdir "$RUNNER_TEMP/ghidra"
          unzip -q "$RUNNER_TEMP/ghidra.zip" -d "$RUNNER_TEMP/ghidra"
          ghidra_dir=$(find "$RUNNER_TEMP/ghidra" -mindepth 1 -maxdepth 1 -type d -name 'ghidra_*_PUBLIC')
          test -f "$ghidra_dir/support/buildExtension.gradle"
          echo "GHIDRA_INSTALL_DIR=$ghidra_dir" >> "$GITHUB_ENV"
      - name: Check maintenance script syntax
        run: |
          node --check .github/scripts/watch-dart.cjs
          node --check .github/scripts/check-issue.cjs
      - name: Build extension
        run: ./gradlew --no-daemon buildExtension
      - name: Retain build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ghidart-${{ steps.ghidra.outputs.tag }}
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 3
  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/') && github.event_name == 'push'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ghidart-${{ needs.build.outputs.ghidra_tag }}
          path: dist
      - name: Publish tag release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          GHIDRA_TAG: ${{ needs.build.outputs.ghidra_tag }}
        run: |
          printf 'Built against Ghidra **%s**, using Java 25. Install the extension ZIP in the matching Ghidra version.\n\nThis is an experimental release; correctness and stability are not fully validated.\n' "$GHIDRA_TAG" > "$RUNNER_TEMP/release-notes.md"
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/*.zip --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/*.zip --verify-tag \
              --title "ghidart $GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
