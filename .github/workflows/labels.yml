name: Prepare issue labels

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/labels.yml'
  workflow_dispatch:

permissions:
  issues: write

jobs:
  labels:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            const labels = [
              ['bug', 'd73a4a', 'A reproducible defect in existing behavior.'],
              ['enhancement', 'a2eeef', 'A feature or workflow improvement.'],
              ['question', 'd876e3', 'A general question; no binary is required.'],
              ['needs-reproduction', 'fbca04', 'A specific binary needs investigation.'],
              ['invalid', 'e4e669', 'Required reproduction information is missing.']
            ];
            for (const [name, color, description] of labels) {
              try {
                await github.rest.issues.getLabel({...context.repo, name});
              } catch (error) {
                if (error.status !== 404) throw error;
                try {
                  await github.rest.issues.createLabel({...context.repo, name, color, description});
                } catch (creationError) {
                  if (creationError.status !== 422) throw creationError;
                  await github.rest.issues.getLabel({...context.repo, name});
                }
              }
            }
