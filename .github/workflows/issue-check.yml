name: Check issue information

on:
  issues:
    types: [opened, edited, reopened, labeled, unlabeled]

permissions:
  contents: read
  issues: write

concurrency:
  group: issue-information-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  check:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/github-script@v7
        with:
          script: |
            const check = require('./.github/scripts/check-issue.cjs');
            // Read the latest report: queued edits may have changed its contents.
            const {data: issue} = await github.rest.issues.get({
              ...context.repo, issue_number: context.issue.number
            });
            await check({github, context: {...context, payload: {...context.payload, issue}}});
